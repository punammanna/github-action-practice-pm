
name: Auto Reviewer

on:
  push:
    paths:
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Clone the repository
      - name: Clone code
        uses: actions/checkout@v4

      # Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Run Python file
      - name: Run Python script
        run: python my_script.py

      # Install linter
      - name: Install linter
        run: pip install ruff

      # Check Python files
      - name: Check file for linting
        run: ruff check .
